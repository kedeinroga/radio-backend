# Cloud Run service configuration example
# Deploy with: gcloud run services replace cloudrun.yaml

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: radio-backend
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        # Enable HTTP/2 (better for streaming)
        run.googleapis.com/http2-enabled: "true"

        # Auto-scaling configuration
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"

        # CPU allocation (only during request processing)
        run.googleapis.com/cpu-throttling: "true"

        # Startup probe configuration
        run.googleapis.com/startup-cpu-boost: "true"

        # VPC connector (if needed for private DB access)
        # run.googleapis.com/vpc-access-connector: projects/PROJECT_ID/locations/REGION/connectors/CONNECTOR_NAME
        # run.googleapis.com/vpc-access-egress: private-ranges-only

        # Cloud SQL connection (if using Cloud SQL)
        # run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:INSTANCE_NAME
    spec:
      serviceAccountName: radio-backend-sa
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - name: radio-backend
        image: gcr.io/PROJECT_ID/radio-backend:latest
        ports:
        - name: http1
          containerPort: 8080

        resources:
          limits:
            cpu: "1000m"
            memory: "512Mi"

        # Environment variables
        env:
        - name: PORT
          value: "8080"

        - name: ENV
          value: "production"

        # Database configuration - Supabase PostgreSQL (Secret Manager)
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-url
              key: latest

        # Redis configuration - Upstash Redis (Secret Manager)
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-url
              key: latest

        # JWT configuration (Secret Manager)
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-private-key
              key: latest

        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-public-key
              key: latest

        - name: JWT_EXPIRATION_HOURS
          value: "24"

        # External API
        - name: RADIO_BROWSER_API_URL
          value: "https://de1.api.radio-browser.info"

        # Logging
        - name: LOG_LEVEL
          value: "info"

        # Startup and liveness probes
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 30

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

  traffic:
  - percent: 100
    latestRevision: true
