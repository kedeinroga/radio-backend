# Cloud Run service configuration example
# Deploy with: gcloud run services replace cloudrun.yaml

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: radio-backend
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        # Enable HTTP/2 (better for streaming)
        run.googleapis.com/http2-enabled: "true"

        # Auto-scaling configuration
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"

        # CPU allocation (only during request processing)
        run.googleapis.com/cpu-throttling: "true"

        # Startup probe configuration
        run.googleapis.com/startup-cpu-boost: "true"

        # VPC connector (if needed for private DB access)
        # run.googleapis.com/vpc-access-connector: projects/PROJECT_ID/locations/REGION/connectors/CONNECTOR_NAME
        # run.googleapis.com/vpc-access-egress: private-ranges-only

        # Cloud SQL connection (if using Cloud SQL)
        # run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:INSTANCE_NAME
    spec:
      serviceAccountName: radio-backend-sa
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - name: radio-backend
        image: gcr.io/PROJECT_ID/radio-backend:latest
        ports:
        - name: http1
          containerPort: 8080

        resources:
          limits:
            cpu: "1000m"
            memory: "512Mi"

        # Environment variables
        env:
        # Server Configuration
        - name: PORT
          value: "8080"

        - name: SERVER_PORT
          value: "8080"

        - name: SERVER_HOST
          value: "0.0.0.0"

        - name: SERVER_ENV
          value: "production"

        - name: SERVER_TIMEOUT
          value: "30s"

        - name: SERVER_BASE_URL
          value: "https://radio-backend-296736956418.us-central1.run.app"

        # Database configuration - Supabase PostgreSQL (Secret Manager)
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-url
              key: latest

        # Redis configuration - Upstash Redis (Secret Manager)
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-url
              key: latest

        # JWT configuration (Secret Manager)
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-private-key
              key: latest

        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-public-key
              key: latest

        - name: JWT_EXPIRATION
          value: "24h"

        - name: JWT_REFRESH_EXPIRATION
          value: "168h"

        # External API
        - name: RADIO_BROWSER_API_URL
          value: "https://de1.api.radio-browser.info"

        # Logging
        - name: LOG_LEVEL
          value: "info"

        - name: LOG_FORMAT
          value: "json"

        # i18n
        - name: DEFAULT_LANGUAGE
          value: "en"

        - name: SUPPORTED_LANGUAGES
          value: "en,es,fr,de"

        # Analytics
        - name: ANALYTICS_BATCH_SIZE
          value: "100"

        - name: ANALYTICS_FLUSH_INTERVAL
          value: "10s"

        # Security
        - name: BCRYPT_COST
          value: "12"

        - name: RATE_LIMIT_REQUESTS
          value: "100"

        - name: RATE_LIMIT_WINDOW
          value: "1m"

        # CORS
        - name: CORS_ALLOWED_ORIGINS
          value: "https://your-frontend-domain.com"

        - name: CORS_ALLOWED_METHODS
          value: "GET,POST,PUT,DELETE,OPTIONS"

        - name: CORS_ALLOWED_HEADERS
          value: "Content-Type,Authorization,X-Language,X-Request-ID"

        # Feature Flags
        - name: FEATURE_PREMIUM_CONTENT
          value: "true"

        - name: FEATURE_ANALYTICS
          value: "true"

        - name: FEATURE_VAULT_INTEGRATION
          value: "false"

        # Advertising Configuration
        - name: AD_IMPRESSION_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: ad-impression-token-secret
              key: latest

        - name: AD_IMPRESSION_TOKEN_MAX_AGE
          value: "5m"

        - name: AD_CACHE_TTL
          value: "10m"

        - name: AD_FREQUENCY_CAP_HOURLY
          value: "6"

        - name: AD_FREQUENCY_CAP_DAILY
          value: "30"

        - name: AD_FRAUD_SCORE_THRESHOLD
          value: "0.7"

        - name: AD_RATE_LIMIT_REQUESTS
          value: "50"

        - name: AD_RATE_LIMIT_WINDOW
          value: "1m"

        # Startup and liveness probes
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 30

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

  traffic:
  - percent: 100
    latestRevision: true
