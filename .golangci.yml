linters-settings:
  cyclop:
    max-complexity: 30

  funlen:
    lines: 150
    statements: 80

  gocognit:
    min-complexity: 40

  nestif:
    min-complexity: 8

  dupl:
    threshold: 150

  goconst:
    min-len: 3
    min-occurrences: 5

  gocyclo:
    min-complexity: 30

  lll:
    line-length: 140

  errcheck:
    check-type-assertions: false
    check-blank: false

  revive:
    rules:
      - name: unused-parameter
        disabled: true
      - name: exported
        disabled: true
      - name: redefines-builtin-id
        disabled: true

linters:
  enable:
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - whitespace
    - bodyclose

  disable:
    - errcheck
    - revive
    - gosec
    - cyclop
    - funlen
    - gocognit
    - nestif
    - dupl
    - goconst
    - gocyclo
    - misspell
    - unconvert
    - unparam
    - nilerr
    - predeclared
    - stylecheck
    - typecheck

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - dupl
        - gocognit
        - errcheck

    - path: cmd/
      linters:
        - funlen
        - gocyclo

    - path: internal/infrastructure/
      linters:
        - dupl

    # Ignore blank imports in database drivers
    - text: "blank-imports"
      linters:
        - revive

    # Ignore underscore in error checks (common pattern)
    - text: "Error return value.*is not checked"
      linters:
        - errcheck

    # Ignore unused helper functions
    - text: "func `(slugify|timePtr)` is unused"
      linters:
        - unused

  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true

  # Use exclude-dirs instead of skip-dirs
  exclude-dirs:
    - vendor
    - tmp
    - bin

  # Use exclude-files instead of skip-files
  exclude-files:
    - ".*\\.pb\\.go$"

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
