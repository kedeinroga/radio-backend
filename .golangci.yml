linters-settings:
  cyclop:
    max-complexity: 15
  
  funlen:
    lines: 60
    statements: 40
  
  gocognit:
    min-complexity: 20
  
  nestif:
    min-complexity: 4
  
  dupl:
    threshold: 100
  
  goconst:
    min-len: 3
    min-occurrences: 3
  
  gocyclo:
    min-complexity: 15
  
  lll:
    line-length: 120
  
  errcheck:
    check-type-assertions: true
    check-blank: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - gosec
    - cyclop
    - funlen
    - gocognit
    - nestif
    - dupl
    - goconst
    - gocyclo
    - misspell
    - unconvert
    - unparam
    - whitespace
    - bodyclose
    - exportloopref
    - nilerr
    - predeclared
    - stylecheck

  disable:
    - typecheck

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - dupl
        - gocognit
    
    - path: cmd/
      linters:
        - funlen
    
    - path: internal/infrastructure/
      linters:
        - dupl

  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - tmp
    - bin
  skip-files:
    - ".*\\.pb\\.go$"

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
