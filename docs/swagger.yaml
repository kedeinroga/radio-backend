        type: integer
    type: object
  internal_handlers.StationDetailResponse:
    properties:
      data:
        $ref: '#/definitions/internal_handlers.StationDTO'
      seo_metadata:
        $ref: '#/definitions/radio-backend_internal_domain.SEOMetadata'
    type: object
  internal_handlers.StationListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_handlers.StationDTO'
        type: array
      meta:
        additionalProperties: true
        type: object
    type: object
  internal_handlers.SuccessResponse:
    properties:
      message:
        example: Operation completed successfully
        type: string
    type: object
  internal_handlers.ValidateTokenRequest:
    properties:
      include_metadata:
        type: boolean
    type: object
  internal_handlers.ValidateTokenResponse:
    properties:
      email:
        example: user@example.com
        type: string
      expires_at:
        example: "2024-01-15T12:30:00Z"
        type: string
      issued_at:
        example: "2024-01-15T12:15:00Z"
        type: string
      role:
        example: guest
        type: string
      session_metadata:
        $ref: '#/definitions/internal_handlers.SessionMetadata'
      token_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      user_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      valid:
        example: true
        type: boolean
    type: object
  radio-backend_internal_domain.Alert:
    properties:
      action:
        type: string
      category:
        description: database, redis, api, partitions, views, performance
        type: string
      level:
        description: info, warning, critical
        type: string
      message:
        type: string
      resolved:
        type: boolean
      timestamp:
        type: string
    type: object
  radio-backend_internal_domain.CreateTranslationRequest:
    properties:
      description:
        type: string
      keywords:
        items:
          type: string
        type: array
      language_code:
        type: string
      station_id:
        type: string
      title:
        maxLength: 200
        type: string
    required:
    - description
    - language_code
    - station_id
    - title
    type: object
  radio-backend_internal_domain.DatabaseHealth:
    properties:
      connections:
        type: integer
      max_connections:
        type: integer
      ping:
        type: boolean
      status:
        description: up, down
        type: string
      usage_percent:
        type: number
    type: object
  radio-backend_internal_domain.ExternalAPIHealth:
    properties:
      avg_response_time_ms:
        $ref: '#/definitions/time.Duration'
      circuit_breaker:
        description: closed, open, half-open
        type: string
      error_count:
        type: integer
      last_error:
        type: string
      status:
        description: up, down, degraded
        type: string
    type: object
  radio-backend_internal_domain.HealthMetrics:
    properties:
      alerts:
        items:
          $ref: '#/definitions/radio-backend_internal_domain.Alert'
        type: array
      database:
        $ref: '#/definitions/radio-backend_internal_domain.DatabaseHealth'
      external_api:
        $ref: '#/definitions/radio-backend_internal_domain.ExternalAPIHealth'
      materialized_views:
        $ref: '#/definitions/radio-backend_internal_domain.MaterializedViewHealth'
      partitions:
        $ref: '#/definitions/radio-backend_internal_domain.PartitionHealth'
      performance_metrics:
        $ref: '#/definitions/radio-backend_internal_domain.PerformanceMetrics'
      redis:
        $ref: '#/definitions/radio-backend_internal_domain.RedisHealth'
      status:
        description: healthy, degraded, unhealthy
        type: string
      timestamp:
        type: string
    type: object
  radio-backend_internal_domain.HreflangTag:
    properties:
      lang:
        example: es
        type: string
      url:
        example: https://radioapp.com/stations/rock-fm-100-1?lang=es
        type: string
    type: object
  radio-backend_internal_domain.LogoutResponse:
    properties:
      blacklisted_at:
        type: string
      message:
        type: string
      success:
        type: boolean
      token_id:
        type: string
    type: object
  radio-backend_internal_domain.MaterializedViewHealth:
    properties:
      avg_refresh_duration_ms:
        $ref: '#/definitions/time.Duration'
      failed_refreshes:
        type: integer
      last_refresh:
        type: string
      stale_views:
        items:
          type: string
        type: array
      status:
        description: healthy, stale, critical
        type: string
      total_views:
        type: integer
    type: object
  radio-backend_internal_domain.PartitionHealth:
    properties:
      last_check:
        type: string
      missing_future_partitions:
        type: integer
      old_partitions_count:
        type: integer
      status:
        description: healthy, warning, critical
        type: string
      total_partitions:
        type: integer
    type: object
  radio-backend_internal_domain.PerformanceMetrics:
    properties:
      avg_response_time_ms:
        type: number
      cache_hit_rate_percent:
        type: number
      error_rate_percent:
        type: number
      requests_per_second:
        type: number
    type: object
  radio-backend_internal_domain.PopularCountry:
    properties:
      code:
        description: ISO 3166-1 alpha-2
        example: US
        type: string
      name:
        example: United States
        type: string
      slug:
        example: united-states
        type: string
      station_count:
        example: 250
        type: integer
    type: object
  radio-backend_internal_domain.PopularTag:
    properties:
      active_count:
        description: Con stream activo
        example: 145
        type: integer
      name:
        example: rock
        type: string
      slug:
        example: rock
        type: string
      station_count:
        example: 150
        type: integer
    type: object
  radio-backend_internal_domain.RedisHealth:
    properties:
      memory_mb:
        type: integer
      ping:
        type: boolean
      status:
        description: up, down
        type: string
      usage_percent:
        type: number
    type: object
  radio-backend_internal_domain.SEOMetadata:
    properties:
      alternate_names:
        example:
        - Rock FM
        - Rock Radio 100.1
        items:
          type: string
        type: array
      canonical_url:
        example: https://radioapp.com/stations/rock-fm-100-1
        type: string
      description:
        example: Listen to the best classic rock hits from the 80s and 90s on Rock
          FM 100.1
        type: string
      hreflang_tags:
        description: Tags hreflang para SEO multiidioma
        items:
          $ref: '#/definitions/radio-backend_internal_domain.HreflangTag'
        type: array
      image_url:
        example: https://cdn.rockfm.com/logo.png
        type: string
      keywords:
        example:
        - rock
        - classic rock
        - 80s
        - radio
        items:
          type: string
        type: array
      language:
        description: Código de idioma (es, en, fr, de)
        example: es
        type: string
      last_modified:
        description: ISO 8601 para schema.org
        example: "2025-12-23T19:30:00Z"
        type: string
      title:
        example: Rock FM 100.1 - Classic Rock Radio
        type: string
    type: object
  radio-backend_internal_domain.SitemapData:
    properties:
      last_updated:
        example: "2025-12-23T19:30:00Z"
        type: string
      popular_countries:
        items:
          $ref: '#/definitions/radio-backend_internal_domain.PopularCountry'
        type: array
      popular_tags:
        items:
          $ref: '#/definitions/radio-backend_internal_domain.PopularTag'
        type: array
      total_stations:
        example: 500
        type: integer
    type: object
  radio-backend_internal_domain.TranslationResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      keywords:
        items:
          type: string
        type: array
      language_code:
        type: string
      station_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  radio-backend_internal_domain.UpdateTranslationRequest:
    properties:
      description:
        type: string
      keywords:
        items:
          type: string
        type: array
      title:
        maxLength: 200
        type: string
    required:
    - description
    - title
    type: object
  time.Duration:
    enum:
    - -9223372036854775808
    - 9223372036854775807
    - 1
    - 1000
    - 1000000
    - 1000000000
    - 60000000000
    - 3600000000000
    format: int64
    type: integer
    x-enum-varnames:
    - minDuration
    - maxDuration
    - Nanosecond
    - Microsecond
    - Millisecond
    - Second
    - Minute
    - Hour
host: localhost:8080
info:
  contact:
    email: support@radiobackend.com
    name: API Support
  description: "Radio streaming API with JWT authentication, analytics and multi-language
    support (i18n).\n\n**Security Features (v2.1):**\n- \U0001F510 Timing attack prevention
    (constant-time operations)\n- \U0001F512 HTTPS enforcement (production)\n- \U0001F6AB
    Account lockout (10 attempts = 30 min lockout)\n- \U0001F4E7 Email rate limiting
    (10 attempts/hour per email)\n- \U0001F511 Password strength enforcement (special
    chars + 47 common passwords blocked)\n- \U0001F6E1️ Session hijacking protection
    (User-Agent validation)\n- \U0001F4DD Security event logging (failed attempts
    with metadata)\n- ⚡ Rate limiting (5 attempts/15min per IP)\n- \U0001F510 JWT
    with RS256 + token revocation\n\n**Internationalization:**\nSupported languages:
    Spanish (es), English (en), French (fr), German (de).\nUse the 'lang' parameter
    or 'Accept-Language' header to specify the desired language.\n\n**Security Score:**
    100/100 (audited Dec 2025)"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Radio Backend API
  version: "2.1"
paths:
  /admin/maintenance/check-partitions:
    get:
      consumes:
      - application/json
      description: Verifies that partitions exist for future months to prevent insertion
        failures.
      parameters:
      - default: 3
        description: Number of months ahead to check
        in: query
        maximum: 12
        minimum: 1
        name: months_ahead
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Check results" example({"success":true,"data":{"results":[{"table_name":"station_plays","partition_name":"station_plays_2026_02","partitions_exist":true}],"has_missing":false}})
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Check future partitions
      tags:
      - Maintenance
  /admin/maintenance/cleanup-partitions:
    post:
      consumes:
      - application/json
      description: Removes partitions older than specified retention period to free
        up disk space.
      parameters:
      - default: 12
        description: Number of months to retain
        in: query
        maximum: 36
        minimum: 1
        name: retention_months
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Cleanup results" example({"success":true,"data":{"results":[{"table_name":"station_plays","partition_name":"station_plays_2024_01","dropped":true,"message":"Partition
            dropped successfully"}],"total_dropped":3}})
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cleanup old partitions
      tags:
      - Maintenance
  /admin/maintenance/full:
    post:
      consumes:
      - application/json
      description: Executes a complete maintenance routine including view refresh,
        partition check, and status report.
      produces:
      - application/json
      responses:
        "200":
          description: Full maintenance results
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Perform full maintenance
      tags:
      - Maintenance
  /admin/maintenance/partition-status:
    get:
      consumes:
      - application/json
      description: Returns detailed status of all partitions including size, row count,
        and date ranges.
      produces:
      - application/json
      responses:
        "200":
          description: Partition status" example({"success":true,"data":{"partitions":[{"partition_name":"station_plays_2026_01","table_name":"station_plays","row_count":15420,"size_mb":2.5,"total_size_mb":3.2}],"total":18}})
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get partition status
      tags:
      - Maintenance
  /admin/maintenance/recommendations:
    get:
      consumes:
      - application/json
      description: Returns recommendations for database maintenance operations that
        should be executed. Shows priority levels and reasons.
      produces:
      - application/json
      responses:
        "200":
          description: Maintenance recommendations" example({"success":true,"data":[{"operation":"refresh_views","priority":"warning","reason":"Vista
            no refrescada en 6+ horas","should_run":true}]})
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token" example({"error":{"code":"unauthorized","message":"invalid
            or expired token"}})
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only" example({"error":{"code":"forbidden","message":"admin
            access required"}})
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error" example({"error":{"code":"maintenance_failed","message":"Failed
            to get recommendations"}})
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get maintenance recommendations
      tags:
      - Maintenance
  /admin/maintenance/refresh-stats:
    get:
      consumes:
      - application/json
      description: Returns statistics about materialized view refreshes including
        duration, success rate, and last refresh time.
      parameters:
      - default: 7
        description: Number of days to look back
        in: query
        maximum: 90
        minimum: 1
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Refresh statistics
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get refresh statistics
      tags:
      - Maintenance
  /admin/maintenance/refresh-views:
    post:
      consumes:
      - application/json
      description: Refreshes materialized views used for SEO and analytics. Can refresh
        all views or specific types (seo/analytics).
      parameters:
      - default: all
        description: 'Type of views to refresh: all, seo, analytics'
        enum:
        - all
        - seo
        - analytics
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Refresh results" example({"success":true,"data":{"results":[{"view_name":"mv_top_tags_seo","duration_ms":245,"rows_affected":150,"status":"SUCCESS"}],"total":3}})
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Refresh materialized views
      tags:
