      old_partitions_count:
        type: integer
      status:
        description: healthy, warning, critical
        type: string
      total_partitions:
        type: integer
    type: object
  radio-backend_internal_domain.PerformanceMetrics:
    properties:
      avg_response_time_ms:
        type: number
      cache_hit_rate_percent:
        type: number
      error_rate_percent:
        type: number
      requests_per_second:
        type: number
    type: object
  radio-backend_internal_domain.PopularCountry:
    properties:
      code:
        description: ISO 3166-1 alpha-2
        example: US
        type: string
      name:
        example: United States
        type: string
      slug:
        example: united-states
        type: string
      station_count:
        example: 250
        type: integer
    type: object
  radio-backend_internal_domain.PopularTag:
    properties:
      active_count:
        description: Con stream activo
        example: 145
        type: integer
      name:
        example: rock
        type: string
      slug:
        example: rock
        type: string
      station_count:
        example: 150
        type: integer
    type: object
  radio-backend_internal_domain.RedisHealth:
    properties:
      memory_mb:
        type: integer
      ping:
        type: boolean
      status:
        description: up, down
        type: string
      usage_percent:
        type: number
    type: object
  radio-backend_internal_domain.SEOMetadata:
    properties:
      alternate_names:
        example:
        - Rock FM
        - Rock Radio 100.1
        items:
          type: string
        type: array
      canonical_url:
        example: https://radioapp.com/stations/rock-fm-100-1
        type: string
      description:
        example: Listen to the best classic rock hits from the 80s and 90s on Rock
          FM 100.1
        type: string
      hreflang_tags:
        description: Tags hreflang para SEO multiidioma
        items:
          $ref: '#/definitions/radio-backend_internal_domain.HreflangTag'
        type: array
      image_url:
        example: https://cdn.rockfm.com/logo.png
        type: string
      keywords:
        example:
        - rock
        - classic rock
        - 80s
        - radio
        items:
          type: string
        type: array
      language:
        description: Código de idioma (es, en, fr, de)
        example: es
        type: string
      last_modified:
        description: ISO 8601 para schema.org
        example: "2025-12-23T19:30:00Z"
        type: string
      title:
        example: Rock FM 100.1 - Classic Rock Radio
        type: string
    type: object
  radio-backend_internal_domain.SitemapData:
    properties:
      last_updated:
        example: "2025-12-23T19:30:00Z"
        type: string
      popular_countries:
        items:
          $ref: '#/definitions/radio-backend_internal_domain.PopularCountry'
        type: array
      popular_tags:
        items:
          $ref: '#/definitions/radio-backend_internal_domain.PopularTag'
        type: array
      total_stations:
        example: 500
        type: integer
    type: object
  radio-backend_internal_domain.TranslationResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      keywords:
        items:
          type: string
        type: array
      language_code:
        type: string
      station_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  radio-backend_internal_domain.UpdateTranslationRequest:
    properties:
      description:
        type: string
      keywords:
        items:
          type: string
        type: array
      title:
        maxLength: 200
        type: string
    required:
    - description
    - title
    type: object
  radio-backend_internal_services.StreamInfo:
    properties:
      bitrateKbps:
        format: float64
        type: number
      bytesStreamed:
        format: int64
        type: integer
      duration:
        $ref: '#/definitions/time.Duration'
      lastUpdate:
        type: string
      sessionID:
        type: string
    type: object
  time.Duration:
    enum:
    - -9223372036854775808
    - 9223372036854775807
    - 1
    - 1000
    - 1000000
    - 1000000000
    - 60000000000
    - 3600000000000
    format: int64
    type: integer
    x-enum-varnames:
    - minDuration
    - maxDuration
    - Nanosecond
    - Microsecond
    - Millisecond
    - Second
    - Minute
    - Hour
host: localhost:8080
info:
  contact:
    email: support@radiobackend.com
    name: API Support
  description: "Radio streaming API with JWT authentication, analytics and multi-language
    support (i18n).\n\n**Security Features (v2.1):**\n- \U0001F510 Timing attack prevention
    (constant-time operations)\n- \U0001F512 HTTPS enforcement (production)\n- \U0001F6AB
    Account lockout (10 attempts = 30 min lockout)\n- \U0001F4E7 Email rate limiting
    (10 attempts/hour per email)\n- \U0001F511 Password strength enforcement (special
    chars + 47 common passwords blocked)\n- \U0001F6E1️ Session hijacking protection
    (User-Agent validation)\n- \U0001F4DD Security event logging (failed attempts
    with metadata)\n- ⚡ Rate limiting (5 attempts/15min per IP)\n- \U0001F510 JWT
    with RS256 + token revocation\n- \U0001F916 Bot protection via shared secret (X-Rradio-Secret
    header)\n\n**Internationalization:**\nSupported languages: Spanish (es), English
    (en), French (fr), German (de).\nUse the 'lang' parameter or 'Accept-Language'
    header to specify the desired language.\n\n**Security Score:** 100/100 (audited
    Dec 2025)"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Radio Backend API
  version: "2.1"
paths:
  /admin/maintenance/check-partitions:
    get:
      consumes:
      - application/json
      description: Verifies that partitions exist for future months to prevent insertion
        failures.
      parameters:
      - default: 3
        description: Number of months ahead to check
        in: query
        maximum: 12
        minimum: 1
        name: months_ahead
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Check results" example({"success":true,"data":{"results":[{"table_name":"station_plays","partition_name":"station_plays_2026_02","partitions_exist":true}],"has_missing":false}})
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Check future partitions
      tags:
      - Maintenance
  /admin/maintenance/cleanup-partitions:
    post:
      consumes:
      - application/json
      description: Removes partitions older than specified retention period to free
        up disk space.
      parameters:
      - default: 12
        description: Number of months to retain
        in: query
        maximum: 36
        minimum: 1
        name: retention_months
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Cleanup results" example({"success":true,"data":{"results":[{"table_name":"station_plays","partition_name":"station_plays_2024_01","dropped":true,"message":"Partition
            dropped successfully"}],"total_dropped":3}})
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cleanup old partitions
      tags:
      - Maintenance
  /admin/maintenance/full:
    post:
      consumes:
      - application/json
      description: Executes a complete maintenance routine including view refresh,
        partition check, and status report.
      produces:
      - application/json
      responses:
        "200":
          description: Full maintenance results
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Perform full maintenance
      tags:
      - Maintenance
  /admin/maintenance/partition-status:
    get:
      consumes:
      - application/json
      description: Returns detailed status of all partitions including size, row count,
        and date ranges.
      produces:
      - application/json
      responses:
        "200":
          description: Partition status" example({"success":true,"data":{"partitions":[{"partition_name":"station_plays_2026_01","table_name":"station_plays","row_count":15420,"size_mb":2.5,"total_size_mb":3.2}],"total":18}})
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get partition status
      tags:
      - Maintenance
  /admin/maintenance/recommendations:
    get:
      consumes:
      - application/json
      description: Returns recommendations for database maintenance operations that
        should be executed. Shows priority levels and reasons.
      produces:
      - application/json
      responses:
        "200":
          description: Maintenance recommendations" example({"success":true,"data":[{"operation":"refresh_views","priority":"warning","reason":"Vista
            no refrescada en 6+ horas","should_run":true}]})
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token" example({"error":{"code":"unauthorized","message":"invalid
            or expired token"}})
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only" example({"error":{"code":"forbidden","message":"admin
            access required"}})
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error" example({"error":{"code":"maintenance_failed","message":"Failed
            to get recommendations"}})
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get maintenance recommendations
      tags:
      - Maintenance
  /admin/maintenance/refresh-stats:
    get:
      consumes:
      - application/json
      description: Returns statistics about materialized view refreshes including
        duration, success rate, and last refresh time.
      parameters:
      - default: 7
        description: Number of days to look back
        in: query
        maximum: 90
        minimum: 1
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Refresh statistics
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get refresh statistics
      tags:
      - Maintenance
  /admin/maintenance/refresh-views:
    post:
      consumes:
      - application/json
      description: Refreshes materialized views used for SEO and analytics. Can refresh
        all views or specific types (seo/analytics).
      parameters:
      - default: all
        description: 'Type of views to refresh: all, seo, analytics'
        enum:
        - all
        - seo
        - analytics
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Refresh results" example({"success":true,"data":{"results":[{"view_name":"mv_top_tags_seo","duration_ms":245,"rows_affected":150,"status":"SUCCESS"}],"total":3}})
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Refresh materialized views
      tags:
      - Maintenance
  /admin/monitoring/alerts:
    get:
      description: |-
        Returns list of active system alerts based on health checks
        Alerts include partition issues, stale materialized views, and other problems
      produces:
      - application/json
      responses:
        "200":
          description: Alerts retrieved successfully
          schema:
            properties:
              alerts:
                items:
                  $ref: '#/definitions/radio-backend_internal_domain.Alert'
                type: array
            type: object
        "500":
          description: Failed to get alerts
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get system alerts
      tags:
      - Monitoring
  /admin/monitoring/health:
    get:
      description: |-
        Returns comprehensive system health metrics including database, Redis, partitions, and materialized views
        This endpoint provides detailed health information for monitoring and alerting
      produces:
      - application/json
      responses:
        "200":
          description: Health metrics retrieved successfully
          schema:
            $ref: '#/definitions/radio-backend_internal_domain.HealthMetrics'
        "500":
          description: Failed to get health metrics
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get health metrics
      tags:
      - Monitoring
  /admin/seo/refresh-stats:
    post:
      description: Updates tag and country statistics from the database. Administrative
        endpoint that requires admin authentication.
      produces:
      - application/json
      responses:
        "200":
          description: Statistics updated
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Refresh SEO statistics (Admin)
      tags:
      - SEO
  /admin/translations:
    post:
      consumes:
      - application/json
      description: 'Creates a new translation for a station in a specific language
        (admin only). Request example: {"station_id": "abc123", "language_code": "en",
        "title": "Rock FM - Free Online Radio", "description": "Listen to Rock FM
        live from USA", "keywords": ["rock", "usa", "music", "online", "free"]}'
      parameters:
      - description: Translation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/radio-backend_internal_domain.CreateTranslationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Translation created successfully
          schema:
            $ref: '#/definitions/radio-backend_internal_domain.TranslationResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Not authorized - Admin only
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Station not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Translation already exists
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a new translation
      tags:
      - Translations
  /admin/translations/{stationId}:
    get:
      description: Gets all available translations for a station (admin only)
      parameters:
      - description: Station ID
        in: path
        name: stationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of translations
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Not authorized - Admin only
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Station not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List all translations for a station
      tags:
      - Translations
  /admin/translations/{stationId}/{lang}:
    delete:
      description: Deletes an existing translation (admin only)
      parameters:
      - description: Station ID
        in: path
        name: stationId
        required: true
        type: string
      - description: Language code (es, en, fr, de)
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Translation deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Not authorized - Admin only
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Translation not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a translation
      tags:
      - Translations
    get:
      description: Gets a station translation in a specific language (admin only)
      parameters:
      - description: Station ID
        in: path
        name: stationId
        required: true
        type: string
      - description: Language code (es, en, fr, de)
        in: path
        name: lang
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Translation found
          schema:
            $ref: '#/definitions/radio-backend_internal_domain.TranslationResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Not authorized - Admin only
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Translation not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a specific translation
      tags:
      - Translations
    put:
      consumes:
      - application/json
      description: Updates an existing translation (admin only)
      parameters:
      - description: Station ID
        in: path
        name: stationId
        required: true
        type: string
      - description: Language code (es, en, fr, de)
        in: path
        name: lang
        required: true
        type: string
      - description: Updated translation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/radio-backend_internal_domain.UpdateTranslationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Translation updated successfully
          schema:
            $ref: '#/definitions/radio-backend_internal_domain.TranslationResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Not authorized - Admin only
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Translation not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a translation
      tags:
      - Translations
  /admin/translations/bulk:
    post:
      consumes:
      - application/json
      description: 'Creates multiple translations in a single operation (admin only).
        Useful for populating translations for multiple stations. Example: [{"station_id":"abc","language_code":"en","title":"Radio
        FM","description":"Listen live","keywords":["radio","music"]},{"station_id":"abc","language_code":"fr","title":"Radio
        FM","description":"Écoutez en direct","keywords":["radio","musique"]}]'
      parameters:
      - description: List of translations to create
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/radio-backend_internal_domain.CreateTranslationRequest'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Translations created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Not authorized - Admin only
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create multiple translations
      tags:
      - Translations
  /analytics/searches/trending:
    get:
      consumes:
      - application/json
      description: Returns the most frequent search terms in a specific time period
        ordered by frequency. Includes absolute count and percentage of total.
      parameters:
      - default: day
        description: 'Time range: hour, day, week, month'
        enum:
        - hour
        - day
        - week
        - month
        in: query
        name: range
        type: string
      - default: 10
        description: Maximum number of results to return
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Trending searches statistics" example({"success":true,"data":[{"search_term":"rock","count":456,"percentage":12.5}]})
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token" example({"error":{"code":"unauthorized","message":"invalid
            or expired token"}})
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only" example({"error":{"code":"forbidden","message":"admin
            access required"}})
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error" example({"error":{"code":"fetch_failed","message":"Failed
            to fetch trending searches"}})
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Trending searches
      tags:
      - Analytics
  /analytics/stations/popular:
    get:
      consumes:
      - application/json
      description: Returns the most played stations in a specific time period ordered
        by number of plays. Includes complete information for each station.
      parameters:
      - default: day
        description: 'Time range: hour, day, week, month'
        enum:
        - hour
        - day
        - week
        - month
        in: query
        name: range
        type: string
      - default: 10
        description: Maximum number of results to return
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Popular stations statistics" example({"success":true,"data":[{"station_id":"abc123","name":"Rock
            FM","country":"USA","plays":1520,"favicon":"https://...","url":"https://..."}]})
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or missing authentication token" example({"error":{"code":"unauthorized","message":"invalid
            or expired token"}})
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Admin users only" example({"error":{"code":"forbidden","message":"admin
            access required"}})
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error" example({"error":{"code":"fetch_failed","message":"Failed
            to fetch popular stations"}})
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Popular stations statistics
      tags:
      - Analytics
  /analytics/users/active:
    get:
      consumes:
      - application/json
      description: Returns the number of authenticated active users in the last 24
        hours. Active users are those who have made at least one authenticated request
        in the specified period.
      produces:
      - application/json
      responses:
        "200":
