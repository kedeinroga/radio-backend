  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticates a user and returns JWT tokens with session information.
        Includes access token, refresh token, session ID, and token metadata.

        **Security Features:**
        - Password hashing: bcrypt with cost factor 12
        - Timing attack prevention: Constant-time operations
        - Rate limiting: 5 attempts per IP per 15 minutes
        - Email rate limiting: 10 attempts per email per hour
        - Account lockout: 10 failed attempts = 30 minute lockout
        - Session hijacking protection: User-Agent validation
        - Security event logging: All failed login attempts logged
        - HTTPS enforcement: Production environment only

        **Error Codes:**
        - `INVALID_CREDENTIALS`: Invalid email or password
        - `ACCOUNT_LOCKED`: Account temporarily locked due to multiple failed attempts
        - `TOO_MANY_ATTEMPTS`: Rate limit exceeded (IP or email)
        - `VALIDATION_ERROR`: Invalid input format
      parameters:
      - description: Login credentials (email and password)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Authentication tokens with session metadata
          schema:
            $ref: '#/definitions/internal_handlers.LoginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Invalid credentials or account locked
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "429":
          description: Too many login attempts (rate limit exceeded)
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying
              type: integer
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      summary: User login
      tags:
      - Authentication
  /auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        Logs out the current user by blacklisting their JWT token
        The token will be invalidated and cannot be used again
        The user must login again to get a new token
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged out
          schema:
            $ref: '#/definitions/radio-backend_internal_domain.LogoutResponse'
        "400":
          description: Invalid request or missing token
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: User not authenticated
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Failed to logout
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - Authentication
  /auth/me:
    get:
      consumes:
      - application/json
      description: Returns the authenticated user information
      produces:
      - application/json
      responses:
        "200":
          description: User information
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
      security:
