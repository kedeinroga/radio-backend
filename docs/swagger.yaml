      summary: Refresh access token
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Creates a new guest user account.

        **Password Requirements:**
        - Minimum 8 characters
        - At least one special character (!@#$%^&*(),.?":{}|<>)
        - Cannot be one of 47 common passwords (e.g., 'password', '12345678', 'qwerty')
        - Passwords are hashed with bcrypt (cost factor 12)

        **Security Features:**
        - Email uniqueness validation (generic error to prevent enumeration)
        - Rate limiting inherited from IP-based middleware
        - HTTPS enforcement in production

        **Error Codes:**
        - `WEAK_PASSWORD`: Password does not meet strength requirements
        - `COMMON_PASSWORD`: Password is in the common passwords blacklist
        - `EMAIL_EXISTS`: Email already registered (generic message)
        - `VALIDATION_ERROR`: Invalid input format
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or password does not meet requirements
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Register new user
      tags:
      - Authentication
  /auth/revoke:
    post:
      consumes:
      - application/json
      description: |-
        Revokes tokens by token ID, session ID, or all user tokens
        Use token_id to revoke specific token, session_id for all session tokens, or revoke_all for all user tokens
      parameters:
      - description: Revocation request (token_id, session_id, or revoke_all)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.RevokeTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Number of tokens revoked
          schema:
            $ref: '#/definitions/internal_handlers.RevokeTokenResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: User not authenticated
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Failed to revoke token
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke tokens
      tags:
      - Authentication
  /auth/sessions:
    get:
      consumes:
      - application/json
      description: |-
        Returns all active sessions for the authenticated user
        Includes device info, location, and activity timestamps for each session
        Current session is marked with is_current flag
      produces:
      - application/json
      responses:
        "200":
          description: List of active user sessions
          schema:
            $ref: '#/definitions/internal_handlers.GetSessionsResponse'
        "401":
          description: User not authenticated
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Failed to retrieve sessions
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user sessions
      tags:
      - Authentication
  /auth/sessions/{sessionId}:
    delete:
      consumes:
      - application/json
      description: |-
        Terminates a specific user session
        Revokes the session and all associated tokens
        Cannot delete current session
      parameters:
      - description: Session ID to delete
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Session terminated successfully
          schema:
            $ref: '#/definitions/internal_handlers.SuccessResponse'
        "400":
          description: Invalid or missing session ID
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: User not authenticated
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Failed to delete session
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete session
      tags:
      - Authentication
  /auth/validate:
    post:
      consumes:
      - application/json
      description: |-
        Validates a JWT token and returns its claims and metadata
        Checks if token is valid, not expired, and not revoked
        Optional session metadata includes browser, OS, IP, and location
      parameters:
      - description: Validation options (include_metadata)
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_handlers.ValidateTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token validation result with claims
          schema:
            $ref: '#/definitions/internal_handlers.ValidateTokenResponse'
        "401":
          description: Invalid, expired or revoked token
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Validate access token
      tags:
      - Authentication
  /favorites:
    get:
      consumes:
      - application/json
      description: Returns the list of favorite stations for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: List of favorite stations
          schema:
            $ref: '#/definitions/internal_handlers.StationListResponse'
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user favorites
      tags:
      - Favorites
    post:
      consumes:
      - application/json
      description: Adds a station to the authenticated user's favorites list
      parameters:
      - description: Station ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.AddFavoriteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Favorite added successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Premium only station
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Station not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Station already in favorites
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Add station to favorites
      tags:
      - Favorites
  /favorites/{stationId}:
    delete:
      consumes:
      - application/json
      description: Removes a station from the authenticated user's favorites list
      parameters:
      - description: Station ID
        in: path
        name: stationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Favorite removed successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Station ID is required
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Favorite not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remove station from favorites
      tags:
      - Favorites
  /seo/popular-countries:
    get:
      description: List of countries with most active stations (useful for sitemap
        and navigation). Maximum 50 countries.
      parameters:
      - default: 50
        description: Results limit
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of popular countries
          schema:
            properties:
              data:
                properties:
                  count:
                    type: integer
                  countries:
                    items:
                      $ref: '#/definitions/radio-backend_internal_domain.PopularCountry'
                    type: array
                  total:
                    type: integer
                type: object
            type: object
        "400":
          description: Invalid parameter
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Top popular countries
      tags:
      - SEO
  /seo/popular-tags:
    get:
      description: List of tags with most active stations (useful for sitemap and
        navigation). Maximum 100 tags.
      parameters:
      - default: 100
        description: Results limit
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of popular tags
          schema:
            properties:
              data:
                properties:
                  count:
                    type: integer
                  tags:
                    items:
                      $ref: '#/definitions/radio-backend_internal_domain.PopularTag'
                    type: array
                  total:
                    type: integer
                type: object
            type: object
        "400":
          description: Invalid parameter
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Top popular tags/genres
      tags:
      - SEO
  /seo/sitemap-data:
    get:
      description: Returns popular tags and countries to build dynamic sitemap.xml.
        Data is cached for 6 hours.
      produces:
      - application/json
      responses:
        "200":
          description: Sitemap data
          schema:
            $ref: '#/definitions/radio-backend_internal_domain.SitemapData'
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Data for generating sitemap
      tags:
      - SEO
  /stations/{id}:
    get:
      consumes:
      - application/json
      description: Gets detailed information for a station by its ID with enriched
        SEO metadata. May return 503 if external service is temporarily unavailable.
      parameters:
      - description: Shared API secret for bot protection
        in: header
        name: X-Rradio-Secret
        required: true
        type: string
      - description: Station ID
        in: path
        name: id
        required: true
        type: string
      - default: es
        description: Language code (es, en, fr, de)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Station detail with SEO metadata
          schema:
            $ref: '#/definitions/internal_handlers.StationDetailResponse'
        "400":
          description: Station ID is required
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized – missing or invalid X-Rradio-Secret
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Premium only station
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Station not found or has no stream
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
        "503":
          description: External service temporarily unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - SharedSecret: []
      summary: Get station detail
      tags:
      - Stations
  /stations/popular:
    get:
      consumes:
      - application/json
      description: List of popular radio stations with optional filters and SEO metadata.
        May return 503 if external service is temporarily unavailable.
      parameters:
      - description: Shared API secret for bot protection
        in: header
        name: X-Rradio-Secret
        required: true
        type: string
      - default: 20
        description: Maximum number of stations
        in: query
        name: limit
        type: integer
      - description: Filter by country code
        in: query
        name: country
        type: string
      - default: es
        description: Language code (es, en, fr, de)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of popular stations with SEO metadata
          schema:
            $ref: '#/definitions/internal_handlers.StationListResponse'
        "401":
          description: Unauthorized – missing or invalid X-Rradio-Secret
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
        "503":
          description: External service temporarily unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - SharedSecret: []
      summary: Get popular stations
      tags:
      - Stations
  /stations/search:
    get:
      consumes:
      - application/json
      description: Searches for radio stations by name or tags with enriched SEO metadata.
        May return 503 if external service is temporarily unavailable (Circuit Breaker
        open).
      parameters:
      - description: Shared API secret for bot protection
        in: header
        name: X-Rradio-Secret
        required: true
        type: string
      - description: Search term
        in: query
        name: q
        required: true
        type: string
      - default: 20
        description: Maximum number of results
        in: query
        name: limit
        type: integer
      - default: es
        description: Language code (es, en, fr, de)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Search results with SEO metadata
          schema:
            $ref: '#/definitions/internal_handlers.StationListResponse'
        "400":
          description: Search parameter required
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized – missing or invalid X-Rradio-Secret
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
        "503":
          description: External service temporarily unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - SharedSecret: []
      summary: Search stations
      tags:
      - Stations
  /stream/heartbeat:
    post:
      consumes:
      - application/json
      description: Actualiza el timestamp de última actividad de una sesión
      parameters:
      - description: Session ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.HeartbeatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Enviar heartbeat de sesión
      tags:
      - Streaming
  /stream/proxy:
    get:
      description: Hace proxy del stream de audio de una estación validando el token
        de sesión
      parameters:
      - description: Token JWT de la sesión
        in: query
        name: token
        required: true
        type: string
      produces:
      - audio/mpeg
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Token inválido o expirado
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Estación no encontrada
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "502":
          description: Error al conectar con el stream
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      summary: Proxy de stream de audio
      tags:
      - Streaming
  /stream/sessions:
    get:
      description: Retorna todas las sesiones de streaming activas del usuario autenticado
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.ActiveSessionsResponse'
        "400":
          description: Invalid user ID format
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obtener sesiones activas del usuario
      tags:
      - Streaming
  /stream/start:
    post:
      consumes:
      - application/json
      description: Para usuarios autenticados crea una sesión completa y retorna una
        URL proxied con token.
      parameters:
      - description: Datos de la sesión
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.StartSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.StartSessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Station not found (guest flow)
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - SharedSecret: []
      - BearerAuth: []
      summary: Iniciar sesión de streaming
      tags:
      - Streaming
  /stream/stats:
    get:
      description: Retorna información sobre streams actualmente activos (solo admin)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.StreamStatsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obtener estadísticas de streams activos
      tags:
      - Streaming
  /stream/stop:
    post:
      consumes:
      - application/json
      description: Finaliza una sesión de streaming y valida impresiones de anuncios
        si aplica
      parameters:
      - description: Session ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.StopSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Detener sesión de streaming
      tags:
      - Streaming
  /translations/{stationId}/languages:
    get:
      description: 'Gets the list of languages for which translations exist for a
        station. Useful for showing a language selector in the frontend. Returns language
        codes: es, en, fr, de'
      parameters:
      - description: Station ID
        in: path
        name: stationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'List of available languages. Example: {\"success\":true,\"data\":[\"es\",\"en\",\"fr\"],\"count\":3}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get available languages for a station
      tags:
      - Translations
  /webhooks/stripe:
    post:
      consumes:
      - application/json
      parameters:
      - description: Stripe webhook signature
        in: header
        name: Stripe-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "400":
          description: Invalid body, missing/invalid signature, or unparseable event
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Failed to process checkout, subscription update, or deletion
          schema:
            $ref: '#/definitions/gin.H'
      summary: Handle Stripe webhook
      tags:
      - premium
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
  SharedSecret:
    description: Shared secret key required for public station and SEO endpoints (bot
      protection).
    in: header
    name: X-Rradio-Secret
    type: apiKey
swagger: "2.0"
