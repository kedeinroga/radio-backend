          description: Session not found or not owned by user
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Failed to delete session
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete session
      tags:
      - Authentication
  /auth/validate:
    post:
      consumes:
      - application/json
      description: |-
        Validates a JWT token and returns its claims and metadata
        Checks if token is valid, not expired, and not revoked
        Optional session metadata includes browser, OS, IP, and location
      parameters:
      - description: Validation options (include_metadata)
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_handlers.ValidateTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token validation result with claims
          schema:
            $ref: '#/definitions/internal_handlers.ValidateTokenResponse'
        "401":
          description: Invalid, expired or revoked token
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Validate access token
      tags:
      - Authentication
  /favorites:
    get:
      consumes:
      - application/json
      description: Returns the list of favorite stations for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: List of favorite stations
          schema:
            $ref: '#/definitions/internal_handlers.StationListResponse'
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user favorites
      tags:
      - Favorites
    post:
      consumes:
      - application/json
      description: Adds a station to the authenticated user's favorites list
      parameters:
      - description: Station ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.AddFavoriteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Favorite added successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied - Premium only station
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Station not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Station already in favorites
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Add station to favorites
      tags:
      - Favorites
  /favorites/{stationId}:
    delete:
      consumes:
      - application/json
      description: Removes a station from the authenticated user's favorites list
      parameters:
      - description: Station ID
        in: path
        name: stationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Favorite removed successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Favorite not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remove station from favorites
      tags:
      - Favorites
  /seo/popular-countries:
    get:
      description: List of countries with most active stations (useful for sitemap
        and navigation). Maximum 50 countries.
      parameters:
      - default: 50
        description: Results limit
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of popular countries
          schema:
            properties:
              data:
                properties:
                  count:
                    type: integer
                  countries:
                    items:
                      $ref: '#/definitions/radio-backend_internal_domain.PopularCountry'
                    type: array
                  total:
                    type: integer
                type: object
            type: object
        "400":
          description: Invalid parameter
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Top popular countries
      tags:
      - SEO
  /seo/popular-tags:
    get:
      description: List of tags with most active stations (useful for sitemap and
        navigation). Maximum 100 tags.
      parameters:
      - default: 100
        description: Results limit
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of popular tags
          schema:
            properties:
              data:
                properties:
                  count:
                    type: integer
                  tags:
                    items:
                      $ref: '#/definitions/radio-backend_internal_domain.PopularTag'
                    type: array
                  total:
                    type: integer
                type: object
            type: object
        "400":
          description: Invalid parameter
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Top popular tags/genres
      tags:
      - SEO
  /seo/sitemap-data:
    get:
      description: Returns popular tags and countries to build dynamic sitemap.xml.
        Data is cached for 6 hours.
      produces:
      - application/json
      responses:
        "200":
          description: Sitemap data
          schema:
            $ref: '#/definitions/radio-backend_internal_domain.SitemapData'
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Data for generating sitemap
      tags:
      - SEO
  /stations/{id}:
    get:
      consumes:
      - application/json
      description: Gets detailed information for a station by its ID with enriched
        SEO metadata. May return 503 if external service is temporarily unavailable.
      parameters:
      - description: Station ID
        in: path
        name: id
        required: true
        type: string
      - default: es
        description: Language code (es, en, fr, de)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Station detail with SEO metadata
          schema:
            $ref: '#/definitions/internal_handlers.StationDetailResponse'
        "403":
          description: Access denied - Premium only station
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Station not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
        "503":
          description: External service temporarily unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Get station detail
      tags:
      - Stations
  /stations/popular:
    get:
      consumes:
      - application/json
      description: List of popular radio stations with optional filters and SEO metadata.
        May return 503 if external service is temporarily unavailable.
      parameters:
      - default: 20
        description: Maximum number of stations
        in: query
        name: limit
        type: integer
      - description: Filter by country code
        in: query
        name: country
        type: string
      - default: es
        description: Language code (es, en, fr, de)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of popular stations with SEO metadata
          schema:
            $ref: '#/definitions/internal_handlers.StationListResponse'
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
        "503":
          description: External service temporarily unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Get popular stations
      tags:
      - Stations
  /stations/search:
    get:
      consumes:
      - application/json
      description: Searches for radio stations by name or tags with enriched SEO metadata.
        May return 503 if external service is temporarily unavailable (Circuit Breaker
        open).
      parameters:
      - description: Search term
        in: query
        name: q
        required: true
        type: string
      - default: 20
        description: Maximum number of results
        in: query
        name: limit
        type: integer
      - default: es
        description: Language code (es, en, fr, de)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Search results with SEO metadata
          schema:
            $ref: '#/definitions/internal_handlers.StationListResponse'
        "400":
          description: Search parameter required
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
        "503":
          description: External service temporarily unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Search stations
      tags:
      - Stations
  /translations/{stationId}/languages:
    get:
      description: 'Gets the list of languages for which translations exist for a
        station. Useful for showing a language selector in the frontend. Returns language
        codes: es, en, fr, de'
      parameters:
      - description: Station ID
        in: path
        name: stationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'List of available languages. Example: {\"success\":true,\"data\":[\"es\",\"en\",\"fr\"],\"count\":3}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get available languages for a station
      tags:
      - Translations
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
